<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>看片 · 记词</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<meta name="description" content="黑板视频：16:9，中英对照，重点词金色，配离线合成的英音朗读。">
<meta name="theme-color" content="#0f5c57">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --board:#0e6d69; --board-2:#0a5651; --frame:#e0a75f; --frame-2:#c58838;
    --chalk:#f4f1e4; --chalk-dim:#cfe3df;
    /* 重点词一律金色（用户 2026-09-04 指定，对齐参考图二）。
       六个色号仍留着，只是全指向同一支金——将来要换回多色只改这一行。 */
    --gold:#f5c542;
    --c0:var(--gold); --c1:var(--gold); --c2:var(--gold);
    --c3:var(--gold); --c4:var(--gold); --c5:var(--gold);
    --ink:#1d1b16; --paper:#f5f1e8; --line:#ddd3c0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Noto Serif SC',ui-serif,Georgia,'Songti SC',serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:1120px;margin:0 auto;padding:18px 16px 56px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .home{color:#7a6a4f;text-decoration:none;font-size:.9rem}
  .home:hover{text-decoration:underline}
  h1{font-size:1.15rem;margin:0;font-weight:600;letter-spacing:.01em}
  h1 small{display:block;font-size:.78rem;color:#8a7c62;font-weight:400;margin-top:3px}

  /* ══ 16:9 黑板 ══ */
  .stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;
    background:linear-gradient(180deg,var(--frame),var(--frame-2));
    padding:clamp(10px,1.6vw,20px);box-shadow:0 14px 34px rgba(40,26,10,.28);overflow:hidden}
  .stage::before{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
    background:repeating-linear-gradient(92deg,rgba(255,255,255,.09) 0 2px,transparent 2px 9px)}
  .board{position:relative;height:100%;border-radius:7px;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 8%,var(--board) 0%,var(--board-2) 78%);
    box-shadow:inset 0 0 60px rgba(0,0,0,.42), inset 0 2px 0 rgba(255,255,255,.06);
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:clamp(14px,3.2vw,42px);text-align:center;gap:clamp(8px,1.6vw,20px)}
  .board::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.1;
    background-image:radial-gradient(rgba(255,255,255,.7) 1px,transparent 1px);background-size:5px 5px}

  .en,.zh{max-width:96%;line-height:1.34;position:relative;z-index:1;
    text-shadow:0 1px 0 rgba(0,0,0,.35), 0 0 14px rgba(255,255,255,.05)}
  .en{font-family:Poppins,'Century Gothic',ui-rounded,ui-sans-serif,'Segoe UI',system-ui,sans-serif;
    font-weight:700;letter-spacing:.045em;color:var(--chalk);
    font-size:clamp(1.02rem,3.35vw,2.45rem)}
  .zh{color:var(--chalk);font-weight:600;letter-spacing:.06em;
    font-family:'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',ui-sans-serif,sans-serif;
    font-size:clamp(.92rem,2.65vw,1.9rem)}
  /* 默认全亮；只有在播放时才逐词提亮，否则停着看就是一片灰 */
  .en w{transition:opacity .12s,text-shadow .12s;opacity:1;border-radius:3px}
  .en.playing w{opacity:.72}
  .en.playing w.said{opacity:.86}
  .en.playing w.on{opacity:1;text-shadow:0 0 16px rgba(255,255,255,.55),0 1px 0 rgba(0,0,0,.4)}
  .en w.k, .zh k{font-style:normal;font-weight:800}
  .k0{color:var(--c0)!important}.k1{color:var(--c1)!important}.k2{color:var(--c2)!important}
  .k3{color:var(--c3)!important}.k4{color:var(--c4)!important}.k5{color:var(--c5)!important}
  .zh k{font-weight:700}
  .cursor{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.14)}
  .cursor i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c2),var(--c0));transition:width .12s linear}
  .counter{position:absolute;top:10px;right:14px;z-index:2;font-size:.72rem;letter-spacing:.14em;
    color:rgba(244,241,228,.5);font-family:ui-monospace,monospace}

  /* ══ 控制条 ══ */
  .bar{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{font:inherit;font-size:.86rem;border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:9px;padding:8px 14px;cursor:pointer;transition:.15s}
  button:hover{background:#faf7f0;border-color:#c9bda3}
  button:disabled{opacity:.4;cursor:default}
  .play{background:var(--board);color:#fff;border-color:var(--board);min-width:104px;font-weight:600}
  .play:hover{background:#0a4a45;border-color:#0a4a45}
  .spacer{flex:1}
  label.tog{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:#6f6350;cursor:pointer}
  select{font:inherit;font-size:.84rem;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .track{width:100%;margin-top:10px;accent-color:var(--board)}
  .meta{font-size:.8rem;color:#8a7c62;margin-top:8px}

  /* ══ 句子清单 ══ */
  /* 清单自己滚，不带着整页滚——否则换句时黑板会被顶出屏幕 */
  .list{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
  .list ol{max-height:44vh;overflow:auto;scroll-behavior:smooth}
  .list h2{font-size:.9rem;margin:0 0 10px;color:#6f6350;font-weight:600;letter-spacing:.04em}
  ol{list-style:none;margin:0;padding:0;counter-reset:s}
  ol li{counter-increment:s;padding:9px 12px 9px 40px;position:relative;border-radius:8px;cursor:pointer;line-height:1.5}
  ol li::before{content:counter(s,decimal-leading-zero);position:absolute;left:12px;top:10px;
    font-family:ui-monospace,monospace;font-size:.72rem;color:#b3a68c}
  ol li:hover{background:#efe9dc}
  ol li[aria-current="true"]{background:#e7f0ee;box-shadow:inset 2px 0 0 var(--board)}
  ol li .e{font-family:ui-sans-serif,system-ui,sans-serif;font-size:.9rem}
  ol li .z{font-size:.86rem;color:#6f6350;margin-top:2px}
  ol li b{font-weight:700;color:#0d5a54}
  @media (max-width:640px){ .bar{gap:8px} button{padding:7px 11px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="ttl">看片<small id="sub">加载中…</small></h1>
    <a class="home" href="listen.html?a=01">切到跟读页 →</a>
  </div>

  <video id="vid" class="stage" style="display:block;background:#000;padding:0" controls playsinline preload="metadata"></video>

  <div class="bar">
    <button class="play" id="play">▶ 播放</button>
    <button id="prev">← 上一句</button>
    <button id="next">下一句 →</button>
    <div class="spacer"></div>
    <select id="rate">
      <option value="0.75">0.75×</option><option value="0.9">0.9×</option>
      <option value="1" selected>1.0×</option><option value="1.25">1.25×</option>
    </select>
    <a class="home" id="dl" download>⤓ 下载 mp4</a>
  </div>
  <div class="meta" id="meta">空格播放/暂停，← → 换句。点下面任意一句，视频跳到那里。</div>

  <div class="list">
    <h2>全文 · 点任意一句跳过去</h2>
    <ol id="list"></ol>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const v=$('#vid'); let D=null, MARK=[], GAP=0.32, i=0, raf=0;

function cur(){ let k=0; for(let n=0;n<MARK.length;n++){ if(v.currentTime>=MARK[n]-0.02) k=n; else break; } return k; }
function mark(){
  const k=cur();
  if(k!==i){ i=k;
    document.querySelectorAll('#list li').forEach((li,n)=>li.setAttribute('aria-current',n===i?'true':'false'));
    const c=document.querySelector('#list li[aria-current="true"]'); if(c) c.scrollIntoView({block:'nearest'});
  }
  raf=requestAnimationFrame(mark);
}
function go(n){ i=Math.max(0,Math.min(MARK.length-1,n)); v.currentTime=MARK[i]+0.01; }

v.addEventListener('play',()=>{ $('#play').textContent='❚❚ 暂停'; cancelAnimationFrame(raf); mark(); });
v.addEventListener('pause',()=>{ $('#play').textContent='▶ 播放'; cancelAnimationFrame(raf); });
$('#play').onclick=()=>v.paused?v.play():v.pause();
$('#prev').onclick=()=>go(cur()-1);
$('#next').onclick=()=>go(cur()+1);
$('#rate').onchange=e=>v.playbackRate=parseFloat(e.target.value);
addEventListener('keydown',e=>{ if(e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();$('#play').click()}
  if(e.key==='ArrowLeft')go(cur()-1); if(e.key==='ArrowRight')go(cur()+1); });

const id=(new URLSearchParams(location.search).get('a')||'01').padStart(2,'0');
fetch('reader/a'+id+'.json').then(r=>r.json()).then(d=>{
  D=d; v.src='reader/a'+id+'.mp4'; $('#dl').href='reader/a'+id+'.mp4';
  $('#ttl').firstChild.textContent='第'+id+'篇 · '+d.title;
  $('#sub').textContent='黑板视频 · 1920×1080 · '+d.sentences.length+' 句 · 英音女声（离线合成）';
  // 句子起点 = 前面各句「解码时长 + 句间停顿」的累加，与 make_video.py 用的是同一份数
  let t=0; MARK=d.sentences.map(s=>{ const at=t; t+=(s.qc&&s.qc.opus?s.qc.opus.dur:s.dur)+GAP; return at; });
  $('#list').innerHTML=d.sentences.map(s=>{
    const e=s.en.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
    const z=s.zh.replace(/\*\*([^*]+)\*\*\(([^)]*)\)/g,'<b>$1</b>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
    return `<li><div class="e">${e}</div><div class="z">${z}</div></li>`;
  }).join('');
  document.querySelectorAll('#list li').forEach((li,n)=>li.onclick=()=>{go(n);v.play()});
}).catch(()=>{ $('#sub').textContent='没找到 reader/a'+id+'.json 或 .mp4'; });
</script>
</body>
</html>
