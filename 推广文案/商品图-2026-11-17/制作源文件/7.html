<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
body { background: linear-gradient(180deg, #fbf5ea 0%, #f3e6cd 100%); }
.no { position: absolute; left: 40px; top: 34px; font-weight: 900; font-size: 15px; color: #fff; background: var(--navy); padding: 5px 12px; border-radius: 8px; letter-spacing: 1px; }
.h { position: absolute; left: 40px; top: 70px; font-weight: 900; font-size: 50px; color: var(--navy); letter-spacing: 1px; line-height: 1.15; }
.h span { color: var(--red); }
.s { position: absolute; left: 42px; top: 136px; font-size: 18px; color: var(--muted); letter-spacing: 1px; }
.grid { position: absolute; left: 32px; right: 32px; top: 184px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.step { background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 6px 16px rgba(16,38,74,.12); display: flex; gap: 14px; align-items: center; height: 196px; }
.pic { flex: none; width: 150px; height: 168px; border-radius: 8px; overflow: hidden; background: #0f2b22; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px #eee; }
.pic img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.pic.v img { object-fit: contain; }
.num { font-family: 'EN'; font-size: 40px; color: var(--gold-deep); line-height: 1; }
.t { font-weight: 900; font-size: 26px; color: var(--navy); margin-top: 6px; }
.d { font-size: 15px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
.who { position: absolute; left: 32px; right: 32px; top: 614px; background: var(--navy); border-radius: 18px; padding: 18px 22px; color: #fff; }
.who .wt { font-weight: 900; font-size: 20px; color: var(--gold); margin-bottom: 12px; }
.who .chips { display: flex; flex-wrap: wrap; gap: 9px; }
.who .chips span { font-weight: 700; font-size: 16px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); padding: 6px 13px; border-radius: 999px; }
</style></head>
<body><div class="canvas">
  <div class="no">怎么用</div>
  <div class="h">一篇故事，<span>四步学透</span></div>
  <div class="s">每篇都按这四步配好了资料，照着做就行</div>
  <div class="grid">
    <div class="step"><div class="pic v"><img src="../assets/scr52_0.png"></div><div><div class="num">01</div><div class="t">看视频</div><div class="d">4K精读视频<br>听朗读，看中英对照</div></div></div>
    <div class="step"><div class="pic"><img src="../assets/jj01_p1.png"></div><div><div class="num">02</div><div class="t">读精讲</div><div class="d">每句拆主干<br>讲语法、配例句</div></div></div>
    <div class="step"><div class="pic"><img src="../assets/cd01_p1.png"></div><div><div class="num">03</div><div class="t">查单词</div><div class="d">音标、词源、搭配<br>近义辨析、例句</div></div></div>
    <div class="step"><div class="pic"><img src="../assets/card_zh2en.png"></div><div><div class="num">04</div><div class="t">听写测</div><div class="d">汉译英、英译汉<br>对答案查漏补缺</div></div></div>
  </div>
  <div class="who">
    <div class="wt">适合谁用</div>
    <div class="chips"><span>考研英语一</span><span>考研英语二</span><span>大学英语四级</span><span>大学英语六级</span><span>想读懂英文好故事的你</span></div>
  </div>
</div></body></html>
