<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
body { background: linear-gradient(180deg, #fbf5ea 0%, #f6ecd9 100%); }
.no { position: absolute; left: 40px; top: 34px; font-weight: 900; font-size: 15px; color: #fff; background: var(--blue); padding: 5px 12px; border-radius: 8px; letter-spacing: 1px; }
.h { position: absolute; left: 40px; top: 70px; font-weight: 900; font-size: 50px; color: var(--navy); letter-spacing: 1px; line-height: 1.15; }
.h span { color: var(--red); }
.s { position: absolute; left: 42px; top: 136px; font-size: 18px; color: var(--muted); letter-spacing: 1px; }
.s b { color: var(--navy); font-weight: 700; }
.grid { position: absolute; left: 32px; right: 32px; top: 182px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 6px 16px rgba(16,38,74,.12); }
.card img { display: block; width: 100%; height: 120px; object-fit: cover; }
.cap { height: 40px; display: flex; align-items: center; padding: 0 12px; font-weight: 700; font-size: 15.5px; color: var(--navy); white-space: nowrap; }
.cap i { font-style: normal; font-family: 'EN'; font-size: 13px; color: var(--gold-deep); margin-right: 8px; }
.more { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; }
.more .pill { background: var(--navy); color: #fff; font-size: 18px; padding: 10px 26px; }
.more .pill span { color: var(--gold); }
</style></head>
<body><div class="canvas">
  <div class="no">卖点 1</div>
  <div class="h">不是背词表，是<span>追故事</span></div>
  <div class="s">70篇真实故事 · <b>科普 · 历史 · 趣闻</b> · 单词跟着故事一起记</div>
  <div class="grid">
    <div class="card"><img src="../assets/ill01.jpg"><div class="cap"><i>01</i>越狱的章鱼</div></div>
    <div class="card"><img src="../assets/ill02.jpg"><div class="cap"><i>02</i>以为柠檬汁能隐身的劫匪</div></div>
    <div class="card"><img src="../assets/ill05.jpg"><div class="cap"><i>05</i>会烤化汽车的大楼</div></div>
    <div class="card"><img src="../assets/ill09.jpg"><div class="cap"><i>09</i>两次卖掉埃菲尔铁塔的骗子</div></div>
    <div class="card"><img src="../assets/ill11.jpg"><div class="cap"><i>11</i>喝下细菌的医生</div></div>
    <div class="card"><img src="../assets/ill21.jpg"><div class="cap"><i>21</i>让蚂蚁变僵尸的真菌</div></div>
    <div class="card"><img src="../assets/ill44.jpg"><div class="cap"><i>44</i>被拒绝了十二次的哈利·波特</div></div>
    <div class="card"><img src="../assets/ill52.jpg"><div class="cap"><i>52</i>向鸸鹋宣战</div></div>
    <div class="card"><img src="../assets/ill70.jpg"><div class="cap"><i>70</i>写给外星人的一张唱片</div></div>
  </div>
  <div class="more"><div class="pill">还有 <span>61</span> 个故事，等你翻开</div></div>
</div></body></html>
