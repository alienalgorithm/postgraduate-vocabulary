<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
body { background: radial-gradient(110% 80% at 50% 10%, #1d4a3b 0%, #0f2b22 55%, #0a1f19 100%); color: #fff; }
.no { position: absolute; left: 40px; top: 34px; font-weight: 900; font-size: 15px; color: var(--navy); background: var(--gold); padding: 5px 12px; border-radius: 8px; letter-spacing: 1px; }
.h { position: absolute; left: 40px; top: 70px; font-weight: 900; font-size: 50px; letter-spacing: 1px; line-height: 1.15; }
.h span { color: var(--gold); }
.s { position: absolute; left: 42px; top: 136px; font-size: 18px; color: #bcd6cb; letter-spacing: 1px; }
.frame { position: absolute; left: 70px; top: 180px; width: 660px; border-radius: 14px; padding: 8px; background: #050b09; box-shadow: 0 24px 50px rgba(0,0,0,.5); }
.frame img { display: block; width: 100%; border-radius: 8px; }
.k4 { position: absolute; right: 54px; top: 162px; background: var(--red); color: #fff; font-weight: 900; font-size: 20px; padding: 5px 12px; border-radius: 10px; transform: rotate(5deg); box-shadow: 0 6px 14px rgba(0,0,0,.35); }
.tags { position: absolute; left: 40px; right: 40px; top: 568px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tag { border: 1.5px solid rgba(242,181,68,.55); border-radius: 12px; padding: 10px 8px; text-align: center; background: rgba(255,255,255,.04); }
.tag b { display: block; font-weight: 900; font-size: 19px; color: #fff; }
.tag i { display: block; font-style: normal; font-size: 13px; color: #a9c7bb; margin-top: 3px; }
.thumbs { position: absolute; left: 40px; right: 40px; top: 672px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.thumbs img { width: 100%; display: block; border-radius: 6px; box-shadow: 0 6px 14px rgba(0,0,0,.4); }
.cnt { position: absolute; left: 0; right: 0; text-align: center; top: 645px; font-size: 14.5px; color: var(--gold); font-weight: 700; letter-spacing: 1px; }
</style></head>
<body><div class="canvas">
  <div class="no">卖点 2</div>
  <div class="h">4K精读视频，<span>一句一句带你读</span></div>
  <div class="s">英文朗读，中文逐块对照，重点词一眼就能看到</div>
  <div class="frame"><img src="../assets/scr02_2.png"></div>
  <div class="k4">4K</div>
  <div class="tags">
    <div class="tag"><b>英文朗读</b><i>边听边看</i></div>
    <div class="tag"><b>中英逐块对照</b><i>每块英文下面有中文</i></div>
    <div class="tag"><b>重点词高亮</b><i>彩色标出，配中文意思</i></div>
    <div class="tag"><b>难句小注</b><i>语法要点写在句下</i></div>
  </div>
  <div class="thumbs">
    <img src="../assets/scr05_0.png"><img src="../assets/scr52_0.png"><img src="../assets/scr70_0.png"><img src="../assets/scr01_0.png">
  </div>
  <div class="cnt">共 70 集 · 每集都配同版 PDF（视频同屏版），不开视频也能看、能打印</div>
</div></body></html>
