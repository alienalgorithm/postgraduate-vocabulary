<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
body { background: linear-gradient(180deg, #eef3fb 0%, #dfe9f8 100%); }
.no { position: absolute; left: 32px; top: 30px; font-weight: 900; font-size: 15px; color: #fff; background: var(--blue); padding: 5px 12px; border-radius: 8px; letter-spacing: 1px; }
.h { position: absolute; left: 32px; top: 64px; font-weight: 900; font-size: 50px; color: var(--navy); letter-spacing: 1px; line-height: 1.15; }
.h span { color: var(--blue); }
.s { position: absolute; left: 34px; top: 130px; font-size: 17px; color: var(--muted); letter-spacing: 1px; }
.s b { color: var(--navy); font-weight: 700; }
.lbl { position: absolute; left: 32px; right: 32px; display: flex; align-items: center; gap: 8px; }
.lbl b { font-weight: 900; font-size: 22px; color: var(--navy); margin-right: 4px; white-space: nowrap; }
.chip { font-weight: 700; font-size: 13.5px; padding: 4px 10px; border-radius: 999px; background: #fff; color: var(--navy); border: 1.5px solid #c9d7ef; white-space: nowrap; }
.chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.sheet { position: absolute; left: 32px; width: 736px; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 12px 28px rgba(16,38,74,.16); }
.sheet img { position: absolute; display: block; }
.sheet::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: linear-gradient(rgba(255,255,255,0), #fff); }
.kick { position: absolute; left: 40px; top: 30px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: 1px; color: var(--blue); white-space: nowrap; }
.kick::before { content: ''; width: 5px; height: 20px; border-radius: 3px; background: var(--blue); }
</style></head>
