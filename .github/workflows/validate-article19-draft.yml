name: Validate article 19 draft

on:
  push:
    branches:
      - article-19-development
    paths:
      - data/article-19.js
      - .github/workflows/validate-article19-draft.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out article 19 branch
        uses: actions/checkout@v6
        with:
          ref: article-19-development
          fetch-depth: 0

      - name: Run production article builder
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_markdown.py | tee /tmp/build-report.txt
          grep -q "articles/19-five-alarms-still-descending.md  270 词 · 50 重点词 · 18.5%" /tmp/build-report.txt
          grep -q "19 篇已生成 · 950 个重点词 · 全部通过" /tmp/build-report.txt
          node --check data/article-19.js
          git diff --check

      - name: Commit generated article 19 Markdown
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/19-five-alarms-still-descending.md
          git commit -m "docs: generate article 19 final Markdown"
          git push origin HEAD:article-19-development
