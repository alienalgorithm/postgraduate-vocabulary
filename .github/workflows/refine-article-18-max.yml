name: Apply article 18 maximum-quality final revision

on:
  push:
    branches:
      - article-18-final-max
    paths:
      - .github/workflows/refine-article-18-max.yml
      - tmp/refine-article-18-max.py

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out refinement branch
        uses: actions/checkout@v6
        with:
          ref: article-18-final-max
          fetch-depth: 0

      - name: Apply final prose and version changes
        shell: bash
        run: |
          set -euo pipefail
          python3 tmp/refine-article-18-max.py
          rm tmp/refine-article-18-max.py

      - name: Regenerate and validate all article surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_markdown.py | tee /tmp/build-report.txt
          grep -q "articles/18-the-sky-would-not-go-quiet.md  270 词 · 50 重点词 · 18.5%" /tmp/build-report.txt
          grep -q "18 篇已生成 · 900 个重点词 · 全部通过" /tmp/build-report.txt
          node scripts/final-version-guard.js --write-manifest
          node scripts/final-version-guard.js | tee /tmp/guard-report.txt
          grep -q "18篇最终版本 · 900个重点词" /tmp/guard-report.txt
          test -f notes/第十八篇入库记录_2026-08-13.md
          test ! -e notes/第十八篇入库记录_2026-08-12.md
          test -f notes/全库最终版本审计_2026-08-13.md
          test ! -e notes/全库最终版本审计_2026-08-12.md
          node --check data/article-18.js
          node --check scripts/final-version-guard.js
          git diff --check

      - name: Commit synchronized final version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refine: lock article 18 at maximum quality"
          git push origin HEAD:article-18-final-max
