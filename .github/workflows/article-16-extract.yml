name: Validate article 16 draft

on:
  push:
    branches:
      - article-16-development
    paths:
      - .github/workflows/article-16-extract.yml
      - data/article-16.js

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v6

      - name: Run the full sixteen-article archive audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_markdown.py | tee /tmp/build-report.txt
          grep -q "16 篇已生成 · 800 个重点词 · 全部通过" /tmp/build-report.txt

      - name: Check article data and exact project metrics
        shell: bash
        run: |
          set -euo pipefail
          node --check data/article-16.js
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          globalThis.window = globalThis;
          require(path.resolve('data/articles.js'));
          for (const file of fs.readdirSync('data').filter(f => /^article-\d+\.js$/.test(f)).sort()) {
            require(path.resolve('data', file));
          }
          const article = globalThis.SITE.ARTICLES.find(item => item.id === '16');
          if (!article) throw new Error('article 16 missing');
          if (article.metrics.words !== 291 || article.metrics.keywords !== 50 || article.metrics.density !== 17.2) {
            throw new Error('article 16 metrics mismatch');
          }
          if (article.paras.length !== 5 || article.glossary.length !== 50) {
            throw new Error('article 16 structure mismatch');
          }
          console.log('article 16 exact metrics and structure verified');
          NODE
