name: Clean merged article 18 branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-article-18-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged development branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encoded=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("article-18-development", safe=""))')
          status=$(curl -sS -o /tmp/ref.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded}")
          if [ "$status" = "200" ]; then
            curl -sS -L --fail-with-body -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
          elif [ "$status" != "404" ]; then
            cat /tmp/ref.json
            exit 1
          fi

      - name: Verify only main remains
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sS -L --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches?per_page=100" > /tmp/branches.json
          python3 - <<'PY'
          import json
          names = [item['name'] for item in json.load(open('/tmp/branches.json', encoding='utf-8'))]
          if names != ['main']:
              raise SystemExit(f'unexpected remaining branches: {names}')
          print('only main remains')
          PY
