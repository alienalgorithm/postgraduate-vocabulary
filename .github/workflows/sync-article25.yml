name: Sync article 25 final

on:
  push:
    branches:
      - article-25-final-release

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: article-25-final-release
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Synchronize article 25 and validate archive
        run: python3 scripts/sync_article25.py
      - name: Commit synchronized final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: lock article 25 and sync 25-article archive"
          git push origin HEAD:article-25-final-release
