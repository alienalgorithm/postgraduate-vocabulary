name: Sync article 26 final

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'article-26-final-clean' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Synchronize all Article 26 surfaces
        run: python3 scripts/sync_article26.py
      - name: Build and validate 26-article archive
        run: python3 scripts/build_markdown.py
      - name: Write final-version manifest and audit report
        run: node scripts/final-version-guard.js --write-manifest
      - name: Revalidate final-version fingerprints
        run: node scripts/final-version-guard.js
      - name: Commit synchronized final state to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "release: lock Article 26 and sync 26-article archive"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
