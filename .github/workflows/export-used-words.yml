name: Export used vocabulary for article 18

on:
  push:
    branches:
      - article-18-development
    paths:
      - .github/workflows/export-used-words.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out article 18 branch
        uses: actions/checkout@v6
        with:
          ref: article-18-development

      - name: Export compact glossary list
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          globalThis.window = globalThis;
          require(path.resolve('data/articles.js'));
          for (const file of fs.readdirSync('data').filter(f => /^article-\d+\.js$/.test(f)).sort()) {
            require(path.resolve('data', file));
          }
          const articles = [...globalThis.SITE.ARTICLES].sort((a,b) => a.id.localeCompare(b.id));
          const lemmas = articles.flatMap(a => a.glossary.map(item => item.w.toLowerCase()));
          const surfaces = articles.flatMap(a => a.paras.flatMap(p => [...p.en.matchAll(/\*\*(.+?)\*\*/g)].map(m => m[1].toLowerCase())));
          fs.writeFileSync('tmp/used-lemmas.txt', lemmas.sort().join(' ') + '\n');
          fs.writeFileSync('tmp/used-surfaces.txt', surfaces.sort().join(' ') + '\n');
          NODE

      - name: Commit compact export
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/used-lemmas.txt tmp/used-surfaces.txt
          git commit -m "chore: export compact used vocabulary for article 18"
          git push origin HEAD:article-18-development
