name: Apply articles 12-15 full ingest

on:
  push:
    branches:
      - articles-12-15-full-ingest
    paths:
      - .github/workflows/apply-articles-12-15.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out ingestion branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decode and verify synchronized payload
        shell: bash
        run: |
          set -euo pipefail
          cat .ingest-12-15/chunk-* | base64 --decode > /tmp/articles-12-15-update.tar.gz
          echo "f1863f7089ad173527784bbf993b2d8db8ce110644bf056cffb05f3aebc4a651  /tmp/articles-12-15-update.tar.gz" | sha256sum -c -
          tar -xzf /tmp/articles-12-15-update.tar.gz -C .

      - name: Validate all fifteen final manuscripts and website
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_markdown.py | tee /tmp/build-report.txt
          grep -q "15 篇已生成 · 750 个重点词 · 全部通过" /tmp/build-report.txt
          git diff --exit-code -- articles
          for file in data/article-*.js assets/site.js assets/js/*.js; do
            node --check "$file"
          done
          for page in index.html article.html words.html; do
            grep -q 'data/article-12.js' "$page"
            grep -q 'data/article-13.js' "$page"
            grep -q 'data/article-14.js' "$page"
            grep -q 'data/article-15.js' "$page"
          done
          grep -q '十五篇《经济学人》风格双语科普短文' index.html
          grep -q '750词词库' words.html
          grep -q 'when-a-broken-pipe-applied-the-brakes' sitemap.xml
          grep -q '15篇文章、750个重点词' README.md
          grep -q '十五篇最终定稿，750个重点词' notes/对话交接文档.md

      - name: Commit validated ingestion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .ingest-12-15
          rm -f .github/workflows/apply-articles-12-15.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "全部入库第十二至第十五篇并同步15篇网站"
          git push origin HEAD:articles-12-15-full-ingest
