name: Apply articles 09-11 full ingest

on:
  push:
    branches:
      - articles-09-11-full-ingest
    paths:
      - .github/workflows/apply-articles-09-11.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out ingestion branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify synchronized payload
        shell: bash
        run: |
          set -euo pipefail
          cat .ingest-09-11/chunk-* | base64 --decode > /tmp/articles-09-11.tar.gz
          echo "58b11d4a0956deca5564fb9292dbd39fece29f0ccd1c5a4090782b476a626940  /tmp/articles-09-11.tar.gz" | sha256sum -c -
          tar -xzf /tmp/articles-09-11.tar.gz -C .

      - name: Validate all eleven final manuscripts and website
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_markdown.py | tee /tmp/build-report.txt
          grep -q "11 篇已生成 · 550 个重点词 · 全部通过" /tmp/build-report.txt
          node --check data/article-09.js
          node --check data/article-10.js
          node --check data/article-11.js
          node --check assets/site.js
          node --check assets/js/index.js
          node --check assets/js/article.js
          node --check assets/js/words.js
          grep -q "十一篇《经济学人》风格双语科普短文" index.html
          grep -q "550词词库" words.html
          grep -q "data/article-11.js" index.html
          grep -q "data/article-11.js" article.html
          grep -q "data/article-11.js" words.html
          grep -q "the-needle-moved-twice" sitemap.xml
          grep -q "当前权威状态：\*\*十一篇最终定稿，550个重点词" notes/对话交接文档.md

      - name: Commit validated ingestion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .ingest-09-11
          rm -f .github/workflows/apply-articles-09-11.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "全部入库第九至第十一篇并同步11篇网站"
          git push origin HEAD:articles-09-11-full-ingest
