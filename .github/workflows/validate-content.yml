name: Validate article archive

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate all article data and generated Markdown
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_markdown.py | tee /tmp/build-report.txt
          grep -q "23 篇已生成 · 1150 个重点词 · 全部通过" /tmp/build-report.txt
          git diff --exit-code -- articles

      - name: Word Inspector v4 quality report
        run: |
          pip install wordfreq --quiet || true
          python3 scripts/inspector.py | tail -30

      - name: Enforce the latest final version of every article
        shell: bash
        run: |
          set -euo pipefail
          node scripts/final-version-guard.js
          test -f data/final-version-manifest.json
          test -f notes/最终版本铁律.md
          test -f notes/全库最终版本审计_2026-08-13.md
          test -f notes/第十九篇入库记录_2026-08-13.md
          test -f notes/第二十篇入库记录_2026-08-13.md

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in data/article-*.js assets/site.js assets/js/*.js scripts/final-version-guard.js; do
            node --check "$file"
          done

      - name: Check synchronized website entry points
        shell: bash
        run: |
          set -euo pipefail
          for page in index.html article.html words.html; do
            grep -q 'data/article-19.js' "$page"
            grep -q 'data/article-20.js' "$page"
          done
          grep -q '二十篇《经济学人》风格双语科普短文' index.html
          grep -q '1000词词库' words.html
          grep -q 'the-market-came-after-the-limit' index.html
          grep -q 'the-market-came-after-the-limit' sitemap.xml
          grep -q '共有 \*\*23篇文章、1150个重点词\*\*' README.md
          grep -q '## 最终版本铁律' README.md
          grep -q '当前权威状态：\*\*二十三篇最终定稿，1150个重点词' notes/对话交接文档.md
          grep -q '## 2. 最终版本铁律（最高优先级）' notes/对话交接文档.md
          grep -q '下一篇编号为 \*\*21\*\*' notes/对话交接文档.md

      - name: Check articles 16 to 20 final identities
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          globalThis.window = globalThis;
          require(path.resolve('data/articles.js'));
          for (const file of fs.readdirSync('data').filter(f => /^article-\d+\.js$/.test(f)).sort()) {
            require(path.resolve('data', file));
          }
          const expected = {
            '16': { words: 270, keywords: 50, density: 18.5, status: '第十六篇最终精进锁定稿' },
            '17': { words: 268, keywords: 50, density: 18.7, status: '第十七篇最终精进锁定稿' },
            '18': { words: 270, keywords: 50, density: 18.5, status: '第十八篇最终精进锁定稿' },
            '19': { words: 267, keywords: 50, density: 18.7, status: '第十九篇最终精进锁定稿' },
            '20': { words: 267, keywords: 50, density: 18.7, status: '第二十篇最终精进锁定稿' }
          };
          for (const [id, metrics] of Object.entries(expected)) {
            const article = globalThis.SITE.ARTICLES.find(item => item.id === id);
            if (!article) throw new Error(`article ${id} missing`);
            if (article.metrics.words !== metrics.words || article.metrics.keywords !== metrics.keywords || article.metrics.density !== metrics.density || article.status !== metrics.status) {
              throw new Error(`article ${id} final identity mismatch`);
            }
            if (article.metrics.words < 240 || article.metrics.words > 270) {
              throw new Error(`article ${id} word count outside preferred 240-270 range`);
            }
            if (article.paras.length !== 5 || article.glossary.length !== 50) {
              throw new Error(`article ${id} structure mismatch`);
            }
          }
          console.log('articles 16 to 20 latest final identities verified');
          NODE
