name: Validate article archive

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-release:
    if: github.event_name == 'pull_request' && github.head_ref == 'article-27-final'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Synchronize and validate Article 27 final state
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/sync_article27.py ]; then
            python3 scripts/sync_article27.py
            python3 scripts/build_markdown.py | tee /tmp/build-report.txt
            grep -q "27 篇已生成 · 1350 个重点词 · 全部通过" /tmp/build-report.txt
            node scripts/final-version-guard.js --write-manifest
            node scripts/final-version-guard.js
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "release: lock Article 27 and sync 27-article archive"
              git push origin HEAD:${{ github.head_ref }}
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: sync-release
    if: always() && (needs.sync-release.result == 'success' || needs.sync-release.result == 'skipped') && needs.sync-release.outputs.changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate all article data and generated Markdown
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_markdown.py | tee /tmp/build-report.txt
          grep -q "全部通过" /tmp/build-report.txt
          git diff --exit-code -- articles

      - name: Word Inspector v4 quality report
        run: |
          pip install wordfreq --quiet
          python3 scripts/test_tools.py
          python3 scripts/inspector.py | tail -35

      - name: Enforce the latest final version of every article
        shell: bash
        run: |
          set -euo pipefail
          node scripts/final-version-guard.js
          test -f data/final-version-manifest.json
          test -f notes/最终版本铁律.md
          test -f notes/全库最终版本审计_2026-08-24.md
          test -f notes/第二十五篇入库记录_2026-08-23.md
          test -f notes/第二十六篇入库记录_2026-08-23.md
          if [ -f data/article-27.js ]; then
            test -f notes/第二十七篇入库记录_2026-08-23.md
          fi
          if [ -f data/article-28.js ]; then
            test -f notes/第二十八篇入库记录_2026-08-24.md
          fi
          if [ -f data/article-29.js ]; then
            test -f notes/第二十九篇入库记录_2026-08-24.md
          fi
          if [ -f data/article-30.js ]; then
            test -f notes/第三十篇入库记录_2026-08-24.md
          fi

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in data/article-*.js assets/site.js assets/js/*.js scripts/final-version-guard.js; do
            node --check "$file"
          done

      - name: Check synchronized website entry points
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          globalThis.window = globalThis;
          require(path.resolve('data/articles.js'));
          for (const file of fs.readdirSync('data').filter(f => /^article-\d+\.js$/.test(f)).sort()) {
            require(path.resolve('data', file));
          }
          const articles = [...globalThis.SITE.ARTICLES].sort((a,b) => a.id.localeCompare(b.id));
          const latest = articles.at(-1);
          const totalKeywords = articles.reduce((n,a) => n + a.metrics.keywords, 0);
          for (const page of ['index.html','article.html','words.html']) {
            const text = fs.readFileSync(page,'utf8');
            const script = `data/article-${latest.id}.js`;
            if (!text.includes(script)) throw new Error(`${page} missing ${script}`);
          }
          const index = fs.readFileSync('index.html','utf8');
          const words = fs.readFileSync('words.html','utf8');
          const readme = fs.readFileSync('README.md','utf8');
          const handoff = fs.readFileSync('notes/对话交接文档.md','utf8');
          const sitemap = fs.readFileSync('sitemap.xml','utf8');
          if (!index.includes(`article.html?a=${latest.slug}`)) throw new Error('index latest link stale');
          if (!index.includes(`${totalKeywords}词`)) throw new Error('index keyword count stale');
          if (!words.includes(`${totalKeywords}词`)) throw new Error('words keyword count stale');
          if (!readme.includes(`**${articles.length}篇文章、${totalKeywords}个重点词**`)) throw new Error('README totals stale');
          if (!handoff.includes(`${totalKeywords}个重点词`)) throw new Error('handoff keyword count stale');
          if (!sitemap.includes(`article.html?a=${latest.slug}`)) throw new Error('sitemap latest article missing');
          console.log(`website synchronized: ${articles.length} articles / ${totalKeywords} keywords / latest ${latest.id}`);
          NODE

      - name: Check articles 16 onward final identities
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          globalThis.window = globalThis;
          require(path.resolve('data/articles.js'));
          for (const file of fs.readdirSync('data').filter(f => /^article-\d+\.js$/.test(f)).sort()) {
            require(path.resolve('data', file));
          }
          const expected = {
            '16': { words: 270, keywords: 50, density: 18.5, status: '第十六篇最终精进锁定稿' },
            '17': { words: 269, keywords: 50, density: 18.6, status: '第十七篇最终精进锁定稿' },
            '18': { words: 269, keywords: 50, density: 18.6, status: '第十八篇最终精进锁定稿' },
            '19': { words: 271, keywords: 50, density: 18.5, status: '第十九篇最终精进锁定稿' },
            '20': { words: 268, keywords: 50, density: 18.7, status: '第二十篇最终精进锁定稿' },
            '21': { words: 271, keywords: 50, density: 18.5, status: '第二十一篇定稿' },
            '22': { words: 271, keywords: 50, density: 18.5, status: '第二十二篇定稿' },
            '23': { words: 268, keywords: 50, density: 18.7, status: '第二十三篇定稿' },
            '24': { words: 261, keywords: 50, density: 19.2, status: '第二十四篇定稿' },
            '25': { words: 267, keywords: 50, density: 18.7, status: '第二十五篇最终精进锁定稿' },
            '26': { words: 268, keywords: 50, density: 18.7, status: '第二十六篇最终精进锁定稿' }
          };
          const article27 = globalThis.SITE.ARTICLES.find(a => a.id === '27');
          if (article27) expected['27'] = { words: 271, keywords: 50, density: 18.5, status: '第二十七篇最终精进锁定稿' };
          const article28 = globalThis.SITE.ARTICLES.find(a => a.id === '28');
          if (article28) expected['28'] = { words: 271, keywords: 50, density: 18.5, status: '第二十八篇最终精进锁定稿' };
          const article29 = globalThis.SITE.ARTICLES.find(a => a.id === '29');
          if (article29) expected['29'] = { words: 271, keywords: 50, density: 18.5, status: '第二十九篇最终精进锁定稿' };
          const article45 = globalThis.SITE.ARTICLES.find(a => a.id === '45');
          if (article45) expected['45'] = { words: 268, keywords: 50, density: 18.7, status: '第四十五篇定稿' };
          const article44 = globalThis.SITE.ARTICLES.find(a => a.id === '44');
          if (article44) expected['44'] = { words: 270, keywords: 50, density: 18.5, status: '第四十四篇定稿' };
          const article43 = globalThis.SITE.ARTICLES.find(a => a.id === '43');
          if (article43) expected['43'] = { words: 268, keywords: 50, density: 18.7, status: '第四十三篇定稿' };
          const article42 = globalThis.SITE.ARTICLES.find(a => a.id === '42');
          if (article42) expected['42'] = { words: 271, keywords: 50, density: 18.5, status: '第四十二篇定稿' };
          const article41 = globalThis.SITE.ARTICLES.find(a => a.id === '41');
          if (article41) expected['41'] = { words: 271, keywords: 50, density: 18.5, status: '第四十一篇定稿' };
          const article40 = globalThis.SITE.ARTICLES.find(a => a.id === '40');
          if (article40) expected['40'] = { words: 270, keywords: 50, density: 18.5, status: '第四十篇定稿' };
          const article39 = globalThis.SITE.ARTICLES.find(a => a.id === '39');
          if (article39) expected['39'] = { words: 266, keywords: 50, density: 18.8, status: '第三十九篇定稿' };
          const article38 = globalThis.SITE.ARTICLES.find(a => a.id === '38');
          if (article38) expected['38'] = { words: 268, keywords: 50, density: 18.7, status: '第三十八篇定稿' };
          const article37 = globalThis.SITE.ARTICLES.find(a => a.id === '37');
          if (article37) expected['37'] = { words: 270, keywords: 50, density: 18.5, status: '第三十七篇定稿' };
          const article36 = globalThis.SITE.ARTICLES.find(a => a.id === '36');
          if (article36) expected['36'] = { words: 268, keywords: 50, density: 18.7, status: '第三十六篇定稿' };
          const article35 = globalThis.SITE.ARTICLES.find(a => a.id === '35');
          if (article35) expected['35'] = { words: 268, keywords: 50, density: 18.7, status: '第三十五篇定稿' };
          const article34 = globalThis.SITE.ARTICLES.find(a => a.id === '34');
          if (article34) expected['34'] = { words: 271, keywords: 50, density: 18.5, status: '第三十四篇定稿' };
          const article33 = globalThis.SITE.ARTICLES.find(a => a.id === '33');
          if (article33) expected['33'] = { words: 264, keywords: 50, density: 18.9, status: '第三十三篇定稿' };
          const article32 = globalThis.SITE.ARTICLES.find(a => a.id === '32');
          if (article32) expected['32'] = { words: 271, keywords: 50, density: 18.5, status: '第三十二篇定稿' };
          const article30 = globalThis.SITE.ARTICLES.find(a => a.id === '30');
          if (article30) expected['30'] = { words: 271, keywords: 50, density: 18.5, status: '第三十篇最终精进锁定稿' };
          for (const [id, metrics] of Object.entries(expected)) {
            const article = globalThis.SITE.ARTICLES.find(item => item.id === id);
            if (!article) throw new Error(`article ${id} missing`);
            if (article.metrics.words !== metrics.words || article.metrics.keywords !== metrics.keywords || article.metrics.density !== metrics.density || article.status !== metrics.status) {
              throw new Error(`article ${id} final identity mismatch`);
            }
            if (article.metrics.words < 249 || article.metrics.words > 271) throw new Error(`article ${id} word count outside allowed range`);
            if (article.paras.length !== 5 || article.glossary.length !== 50) throw new Error(`article ${id} structure mismatch`);
          }
          console.log(`articles 16 to ${article30 ? '30' : article29 ? '29' : article28 ? '28' : article27 ? '27' : '26'} latest final identities verified`);
          NODE
