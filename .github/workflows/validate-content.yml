name: Validate article archive

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate all article data and generated Markdown
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_markdown.py | tee /tmp/build-report.txt
          grep -q "15 篇已生成 · 750 个重点词 · 全部通过" /tmp/build-report.txt

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in data/article-*.js assets/site.js assets/js/*.js; do
            node --check "$file"
          done

      - name: Check synchronized website entry points
        shell: bash
        run: |
          set -euo pipefail
          for page in index.html article.html words.html; do
            grep -q 'data/article-12.js' "$page"
            grep -q 'data/article-13.js' "$page"
            grep -q 'data/article-14.js' "$page"
            grep -q 'data/article-15.js' "$page"
          done
          grep -q '十五篇《经济学人》风格双语科普短文' index.html
          grep -q '750词词库' words.html
          grep -q 'when-a-broken-pipe-applied-the-brakes' index.html
          grep -q 'when-a-broken-pipe-applied-the-brakes' sitemap.xml
          grep -q '共有 \*\*15篇文章、750个重点词\*\*' README.md
          grep -q '当前权威状态：\*\*十五篇最终定稿，750个重点词' notes/对话交接文档.md
