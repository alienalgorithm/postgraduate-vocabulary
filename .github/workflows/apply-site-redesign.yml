name: Apply site redesign payload

on:
  push:
    branches: [main]
    paths:
      - ".site-redesign-payload/**"
      - ".github/workflows/apply-site-redesign.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode, verify and unpack redesign
        shell: bash
        run: |
          set -euo pipefail
          cat .site-redesign-payload/chunk-* | base64 --decode > /tmp/site-redesign.tar.gz
          echo "d3921654ce6fa4b76d5c3031548a82e563d70cf7f342057d26a1f0c26c0b1cb5  /tmp/site-redesign.tar.gz" | sha256sum -c -
          tar -xzf /tmp/site-redesign.tar.gz -C .
          rm -rf .site-redesign-payload

      - name: Commit rebuilt website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "彻底重构双语词汇网站"
          git push
