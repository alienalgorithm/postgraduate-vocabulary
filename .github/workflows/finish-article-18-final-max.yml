name: Apply definitive article 18 language finish

on:
  push:
    branches:
      - article-18-final-max-v3
    paths:
      - .github/workflows/finish-article-18-final-max.yml
      - tmp/finish-article-18-final-max.py

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out final branch
        uses: actions/checkout@v6
        with:
          ref: article-18-final-max-v3
          fetch-depth: 0

      - name: Apply definitive language finish
        shell: bash
        run: |
          set -euo pipefail
          python3 tmp/finish-article-18-final-max.py
          rm tmp/finish-article-18-final-max.py

      - name: Regenerate and validate all final surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_markdown.py | tee /tmp/build-report.txt
          grep -q "articles/18-the-sky-would-not-go-quiet.md  270 词 · 50 重点词 · 18.5%" /tmp/build-report.txt
          grep -q "18 篇已生成 · 900 个重点词 · 全部通过" /tmp/build-report.txt
          node scripts/final-version-guard.js --write-manifest
          node scripts/final-version-guard.js | tee /tmp/guard.txt
          grep -q "18篇最终版本 · 900个重点词" /tmp/guard.txt
          grep -q "\*\*Pigeons\*\* had \*\*roosted\*\* inside" articles/18-the-sky-would-not-go-quiet.md
          grep -q "Nearby, Princeton \*\*physicists\*\*" articles/18-the-sky-would-not-go-quiet.md
          grep -q "treated that interpretation as \*\*provisional\*\*" articles/18-the-sky-would-not-go-quiet.md
          grep -q "寻找\*\*原初宇宙留下的\*\*(primordial)" articles/18-the-sky-would-not-go-quiet.md
          node --check data/article-18.js
          node --check scripts/final-version-guard.js
          git diff --check

      - name: Commit synchronized definitive version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refine: finish article 18 definitive language pass"
          git push origin HEAD:article-18-final-max-v3
