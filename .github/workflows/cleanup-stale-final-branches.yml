name: Clean stale final-version branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-stale-final-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches that preserve superseded or already-merged article versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            "agent/publish-final-articles"
            "article-08-site-rebuild"
            "article-16-development"
            "article-17-268-cloud"
            "article-17-development"
            "article-17-final-polish"
            "articles-09-11-full-ingest"
            "articles-12-15-full-ingest"
            "final-version-audit-2026-08-12"
          )

          for branch in "${branches[@]}"; do
            encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")
            status=$(curl -sS -o /tmp/ref.json -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded}")
            if [ "$status" = "200" ]; then
              curl -sS -L --fail-with-body -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
              echo "deleted ${branch}"
            elif [ "$status" = "404" ]; then
              echo "already absent: ${branch}"
            else
              cat /tmp/ref.json
              exit 1
            fi
          done

      - name: Verify only main remains
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sS -L --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            > /tmp/branches.json
          python3 - <<'PY'
          import json
          names = [item['name'] for item in json.load(open('/tmp/branches.json', encoding='utf-8'))]
          if names != ['main']:
              raise SystemExit(f'unexpected remaining branches: {names}')
          print('only main remains')
          PY
