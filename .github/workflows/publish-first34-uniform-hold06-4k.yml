name: Publish first 34 articles 4K hold06 bundle
on:
  push:
    branches: [codex/first34-uniform-hold06-4k-v1]
    paths: [.github/first34-uniform-hold06-release/**, .github/workflows/publish-first34-uniform-hold06-4k.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'alienalgorithm/postgraduate-vocabulary'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all first34 archived MP4s and publish unchanged ZIP
        run: python -u .github/first34-uniform-hold06-release/publish_first34.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first34-uniform-hold06-release-verification-${{ github.run_id }}
          path: bundle-release-output/RELEASE-VERIFICATION.json
          if-no-files-found: warn
          retention-days: 30
