name: Apply article 17 268-word cloud final

on:
  push:
    branches:
      - article-17-268-cloud
    paths:
      - .github/workflows/article-17-268-cloud.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cloud-final branch
        uses: actions/checkout@v6
        with:
          ref: article-17-268-cloud
          fetch-depth: 0

      - name: Promote the 268-word manuscript to canonical data
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing expected text: {label}')
              return text.replace(old, new, 1)

          data_path = Path('data/article-17.js')
          data = data_path.read_text(encoding='utf-8')

          replacements = [
              ('"status": "第十七篇最终精校稿"', '"status": "第十七篇最终精进锁定稿"', 'status'),
              ('"words": 263', '"words": 268', 'word metric'),
              ('"density": 19.0', '"density": 18.7', 'density metric'),
              (
                  "In a dark Manchester laboratory in 1909, **undergraduate** Ernest Marsden joined Hans Geiger in testing an **unusual** suggestion from Ernest Rutherford. A **radioactive** **emitter** sent **alpha** particles towards metal **foil**. A lead **shield** blocked the direct beam; a **fluorescent** zinc-sulphide **screen** produced a **flash** when a particle returned.",
                  "In 1909, **undergraduate** Ernest Marsden joined Hans Geiger in a dark Manchester laboratory to test an **unusual** suggestion from Ernest Rutherford. A **radioactive** **emitter** sent **alpha** particles towards metal **foil**. A lead **shield** blocked the direct beam; a **fluorescent** zinc-sulphide **screen** produced a **flash** when struck by a returning particle.",
                  'English paragraph 1',
              ),
              (
                  "1909年，在曼彻斯特一间昏暗的实验室里，**本科生**(undergraduate)欧内斯特·马斯登与汉斯·盖革一起检验欧内斯特·卢瑟福提出的一个**不同寻常的**(unusual)设想。一个**放射性**(radioactive)**发射源**(emitter)把**阿尔法**(alpha)粒子射向金属**薄箔**(foil)。铅制**屏障**(shield)挡住直达粒子束；若有粒子折返回来并撞上**荧光的**(fluorescent)硫化锌**屏幕**(screen)，屏上便会出现一次**闪光**(flash)。",
                  "1909年，在曼彻斯特一间昏暗的实验室里，**本科生**(undergraduate)欧内斯特·马斯登与汉斯·盖革一起检验欧内斯特·卢瑟福提出的一个**不同寻常的**(unusual)设想。一个**放射性**(radioactive)**发射源**(emitter)把**阿尔法**(alpha)粒子射向金属**薄箔**(foil)。铅制**屏障**(shield)挡住直达粒子束；若有折返粒子撞上**荧光的**(fluorescent)硫化锌**屏幕**(screen)，屏上便会出现一次**闪光**(flash)。",
                  'Chinese paragraph 1',
              ),
              (
                  "Most crossed the sheet or changed direction only **slightly**. Yet a few emerged **backward** from the side of **incidence**. In one **platinum** test, roughly one in 8,000 returned. The **majority** followed the expected route; this tiny **fraction** underwent a large **deflection**. Given the particles' **momentum**, such reversal was **astonishing**: repeated weak **collisions** should not produce it.",
                  "Most passed through the foil or changed direction only **slightly**. Yet a few underwent **backward** scattering, returning to the side of **incidence**. In one **platinum** test, roughly one in 8,000 was reflected. The **majority** followed the expected route; a tiny **fraction** underwent a large **deflection**. Given the particles' **momentum**, such reversal was **astonishing**: repeated weak **collisions** could scarcely explain it.",
                  'English paragraph 2',
              ),
              (
                  "大多数粒子穿过薄箔，或只是**轻微**(slightly)改变方向。但仍有少数从**入射**(incidence)一侧**向后**(backward)折返。在一次使用**铂**(platinum)的试验中，大约每8000个粒子就有一个返回。**绝大多数**(majority)沿预期路线前进；这**极小一部分**(fraction)粒子却发生了大角度**偏转**(deflection)。考虑到粒子的**动量**(momentum)，这种掉头极其**令人震惊**(astonishing)：连续的微弱**碰撞**(collisions)不应产生这种结果。",
                  "大多数粒子穿过薄箔，或只发生**轻微**(slightly)偏转。但仍有少数发生**反向的**(backward)散射，回到**入射**(incidence)一侧。在一次使用**铂**(platinum)箔的试验中，大约每8000个粒子就有一个被反射。**绝大多数**(majority)沿预期路线前进；只有极小一**部分**(fraction)粒子发生了大角度**偏转**(deflection)。考虑到粒子的**动量**(momentum)，这种掉头极其**令人震惊**(astonishing)：连续的微弱**碰撞**(collisions)几乎无法解释这种结果。",
                  'Chinese paragraph 2',
              ),
              (
                  "Thomson's atom contained **electrons** **embedded** in **diffuse** positive charge. Each **encounter** gave only a weak push. Rutherford's 1911 analysis required an **intense** **impulse** from a compact centre. Most **atomic** **volume** was empty; mass and charge were **concentrated** in the tiny body later called the **nucleus**.",
                  "Thomson's atom contained **electrons** **embedded** in **diffuse** positive charge. Each **encounter** delivered only a weak push. Rutherford's 1911 analysis required an **intense** **impulse** from a compact centre. Most of the **atomic** **volume** was empty; mass and charge were **concentrated** in the tiny body later called the **nucleus**.",
                  'English paragraph 3',
              ),
              (
                  "Rutherford's theory did more than explain the event: it risked being wrong. Its **formula** said the number scattered through a large angle should be **proportional** to foil **thickness** and the **square** of central charge, but should vary **inversely** with the **fourth** power of alpha velocity. Geiger and Marsden's **systematic** 1912–13 measurements tested those **quantitative** predictions; the **distribution** of counts across angles supplied **confirmation**.",
                  "Rutherford's theory did more than explain the anomaly: it risked being wrong. At a fixed large angle, its **formula** predicted counts **proportional** to foil **thickness** and the **square** of the central charge, but **inversely** proportional to the **fourth** power of alpha velocity. Geiger and Marsden's **systematic** 1912–13 measurements tested those **quantitative** predictions; the angular **distribution** provided **confirmation**.",
                  'English paragraph 4',
              ),
              (
                  "卢瑟福的理论不只解释了现象，还把自己交给数字检验。它的**公式**(formula)指出，发生大角度散射的粒子数应与薄箔**厚度**(thickness)以及中心电荷的**平方**(square)成**正比**(proportional)，却应与阿尔法粒子速度的**四次方**(fourth)成**反比**(inversely)。盖革和马斯登在1912至1913年**系统开展的**(systematic)测量，检验了这些**定量的**(quantitative)预测；各个角度上的计数**分布**(distribution)为理论提供了**佐证**(confirmation)。",
                  "卢瑟福的理论不只解释了这处异常，还把自己置于可能被测量推翻的位置。在一个给定的大角度上，它的**公式**(formula)预测，粒子计数应与薄箔**厚度**(thickness)和中心电荷的**平方**(square)成**正比**(proportional)，却应与阿尔法粒子速度的**四次方**(fourth)成**反比**(inversely)。盖革和马斯登在1912至1913年**系统开展的**(systematic)测量检验了这些**定量的**(quantitative)预测；散射粒子的角**分布**(distribution)为理论提供了**佐证**(confirmation)。",
                  'Chinese paragraph 4',
              ),
              (
                  "The discovery was **collective**: Marsden counted flashes, Geiger imposed experimental **discipline**, Rutherford made the **deduction**. Measurements upheld the **empirical** **framework**. A **textbook** **narrative** compresses this into one man's **revelation**. The **outliers** mattered because a team counted them—and let the few that came back **overturn** the model the many seemed to confirm.",
                  "The discovery was **collective**: Marsden counted flashes, Geiger brought experimental **discipline**, Rutherford made the **deduction**. Their **empirical** **framework** linked observation to prediction. A **textbook** **narrative** compresses the sequence into a single **revelation**. The **outliers** mattered because a team counted them—and let the few that came back **overturn** the model the many seemed to confirm.",
                  'English paragraph 5',
              ),
              (
                  "这项发现是**集体完成的**(collective)：马斯登逐一计数闪光，盖革保证实验**严谨有序**(discipline)，卢瑟福则得出关键**推论**(deduction)。后续测量支撑了这套**以观察为依据的**(empirical)**框架**(framework)。一套**教科书式的**(textbook)**叙事**(narrative)常把这一过程压缩成某一个人的一次**顿悟**(revelation)。但真正重要的，是那些**离群结果**(outliers)被一支团队认真计数；正是少数折返的粒子，最终**推翻了**(overturn)多数粒子似乎正在证实的模型。",
                  "这项发现是**集体完成的**(collective)：马斯登逐一计数闪光，盖革保证实验**严谨有序**(discipline)，卢瑟福则得出关键**推论**(deduction)。他们建立的这套**以观察为依据的**(empirical)**框架**(framework)，把观测与预测连接起来。一套**教科书式的**(textbook)**叙事**(narrative)常把这一连串过程压缩成一次**顿悟**(revelation)。但真正重要的，是那些**离群结果**(outliers)被一支团队认真计数；正是少数折返的粒子，最终**推翻了**(overturn)多数粒子似乎正在证实的模型。",
                  'Chinese paragraph 5',
              ),
          ]
          for old, new, label in replacements:
              data = replace_once(data, old, new, label)
          data_path.write_text(data, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = replace_once(readme, '**263词 · 50词 · 19.0%**', '**268词 · 50词 · 18.7%**', 'README metric')
          readme = replace_once(readme, '第17篇以263词最终精校稿为准。', '第17篇以268词最终精进锁定稿为准。', 'README status')
          readme_path.write_text(readme, encoding='utf-8')

          handoff_path = Path('notes/对话交接文档.md')
          handoff = handoff_path.read_text(encoding='utf-8')
          handoff = replace_once(handoff, '**263 / 50 / 19.0%** | **第十七篇最终精校稿**', '**268 / 50 / 18.7%** | **第十七篇最终精进锁定稿**', 'handoff table')
          handoff = replace_once(handoff, '正式指标：**263词 / 50重点词 / 19.0%**。', '正式指标：**268词 / 50重点词 / 18.7%**。', 'handoff metric')
          handoff = replace_once(handoff, '> In a dark Manchester laboratory in 1909, **undergraduate** Ernest Marsden joined Hans Geiger in testing an **unusual** suggestion from Ernest Rutherford.', '> In 1909, **undergraduate** Ernest Marsden joined Hans Geiger in a dark Manchester laboratory to test an **unusual** suggestion from Ernest Rutherford.', 'handoff opening')
          handoff = replace_once(handoff, '- 指标不是263词 / 50重点词 / 19.0%', '- 指标不是268词 / 50重点词 / 18.7%', 'handoff invalid metric')
          handoff_path.write_text(handoff, encoding='utf-8')

          record_path = Path('notes/第十七篇入库记录_2026-08-12.md')
          record = record_path.read_text(encoding='utf-8')
          record = replace_once(record, '> 状态：第十七篇最终精校稿', '> 状态：第十七篇最终精进锁定稿', 'record status')
          record = replace_once(record, '- 英文正文：263词', '- 英文正文：268词', 'record words')
          record = replace_once(record, '- 关键词密度：19.0%', '- 关键词密度：18.7%', 'record density')
          record = replace_once(record, '最终锁定为263词 / 50重点词 / 19.0%。', '最终精进锁定为268词 / 50重点词 / 18.7%。新增的五个词用于补全荧光屏受击因果、反向散射术语、固定散射角条件，以及“观测—预测”方法论链条，不属于冗余扩写。', 'record final line')
          record_path.write_text(record, encoding='utf-8')

          validation_path = Path('.github/workflows/validate-content.yml')
          validation = validation_path.read_text(encoding='utf-8')
          validation = replace_once(validation, "'17': { words: 263, keywords: 50, density: 19.0 }", "'17': { words: 268, keywords: 50, density: 18.7 }", 'validation metrics')
          validation_path.write_text(validation, encoding='utf-8')
          PY

      - name: Regenerate and validate the complete archive
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_markdown.py | tee /tmp/build-report.txt
          grep -q "17 篇已生成 · 850 个重点词 · 全部通过" /tmp/build-report.txt
          grep -q "articles/17-the-few-that-came-back.md  268 词 · 50 重点词 · 18.7%" /tmp/build-report.txt
          node --check data/article-17.js
          git diff --check

      - name: Commit the cloud-final manuscript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/article-17.js articles/17-the-few-that-came-back.md README.md notes/对话交接文档.md notes/第十七篇入库记录_2026-08-12.md .github/workflows/validate-content.yml
          git commit -m "refine: promote article 17 to the 268-word cloud final"
          git push origin HEAD:article-17-268-cloud
