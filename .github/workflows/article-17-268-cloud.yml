name: Apply article 17 268-word cloud final

on:
  push:
    branches:
      - article-17-268-cloud
    paths:
      - .github/workflows/article-17-268-cloud.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cloud-final branch
        uses: actions/checkout@v6
        with:
          ref: article-17-268-cloud
          fetch-depth: 0

      - name: Apply the canonical 268-word manuscript
        shell: bash
        run: |
          set -euo pipefail
          node tmp/apply-article17-268.js
          python3 scripts/build_markdown.py | tee /tmp/build-report.txt
          grep -q "17 篇已生成 · 850 个重点词 · 全部通过" /tmp/build-report.txt
          grep -q "articles/17-the-few-that-came-back.md  268 词 · 50 重点词 · 18.7%" /tmp/build-report.txt
          node --check data/article-17.js
          git diff --check

      - name: Commit the cloud-final manuscript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/article-17.js articles/17-the-few-that-came-back.md README.md notes/对话交接文档.md notes/第十七篇入库记录_2026-08-12.md
          git commit -m "refine: promote article 17 to the 268-word cloud final"
          git push origin HEAD:article-17-268-cloud
