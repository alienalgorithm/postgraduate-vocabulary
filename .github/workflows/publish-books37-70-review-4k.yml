name: Publish books37–70 individual review videos
on:
  push:
    branches: [codex/books37-70-review-4k-v1]
    paths: [.github/books37-70-review-release/**, .github/workflows/publish-books37-70-review-4k.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'alienalgorithm/postgraduate-vocabulary'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged existing videos and publish their review ZIP
        run: python -u .github/books37-70-review-release/publish_review.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: books37-70-review-release-verification-${{ github.run_id }}
          path: review-release-output/RELEASE-VERIFICATION.json
          if-no-files-found: warn
          retention-days: 30
