name: Inventory glossary for article 19

on:
  push:
    branches:
      - article-19-development
    paths:
      - .github/workflows/dump-glossary-19.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out article 19 branch
        uses: actions/checkout@v6
        with:
          ref: article-19-development
          fetch-depth: 0

      - name: Collect glossary and bold surface forms
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          globalThis.window = globalThis;
          require(path.resolve('data/articles.js'));
          for (const file of fs.readdirSync('data').filter(f => /^article-\d+\.js$/.test(f)).sort()) {
            require(path.resolve('data', file));
          }
          const glossary = [];
          const surfaces = [];
          const byArticle = {};
          for (const article of globalThis.SITE.ARTICLES) {
            byArticle[article.id] = article.glossary.map(item => item.w);
            for (const item of article.glossary) glossary.push({ article: article.id, word: item.w, paragraph: item.p });
            for (const para of article.paras) {
              const matches = [...para.en.matchAll(/\*\*([^*]+)\*\*/g)].map(m => m[1]);
              for (const word of matches) surfaces.push({ article: article.id, surface: word });
            }
          }
          const output = {
            articleCount: globalThis.SITE.ARTICLES.length,
            glossaryCount: glossary.length,
            surfaceCount: surfaces.length,
            glossary,
            glossaryWords: glossary.map(x => x.word).sort((a,b)=>a.localeCompare(b)),
            surfaceForms: surfaces.map(x => x.surface).sort((a,b)=>a.localeCompare(b)),
            byArticle
          };
          fs.mkdirSync('tmp', { recursive: true });
          fs.writeFileSync('tmp/used-glossary-01-18.json', JSON.stringify(output, null, 2) + '\n');
          console.log(`articles=${output.articleCount} glossary=${output.glossaryCount} surfaces=${output.surfaceCount}`);
          if (output.articleCount !== 18 || output.glossaryCount !== 900 || output.surfaceCount !== 900) process.exit(1);
          NODE

      - name: Commit inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/used-glossary-01-18.json
          git commit -m "audit: record 900 used terms before article 19"
          git push origin HEAD:article-19-development
