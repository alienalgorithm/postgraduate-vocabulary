name: Validate article 17 draft

on:
  push:
    branches:
      - article-17-development
    paths:
      - .github/workflows/article-17-extract.yml
      - data/article-17.js

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v6

      - name: Run the full seventeen-article archive audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_markdown.py | tee /tmp/build-report.txt
          grep -q "17 篇已生成 · 850 个重点词 · 全部通过" /tmp/build-report.txt

      - name: Check article data and exact project metrics
        shell: bash
        run: |
          set -euo pipefail
          node --check data/article-17.js
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          globalThis.window = globalThis;
          require(path.resolve('data/articles.js'));
          for (const file of fs.readdirSync('data').filter(f => /^article-\d+\.js$/.test(f)).sort()) {
            require(path.resolve('data', file));
          }
          const article = globalThis.SITE.ARTICLES.find(item => item.id === '17');
          if (!article) throw new Error('article 17 missing');
          if (article.metrics.words !== 262 || article.metrics.keywords !== 50 || article.metrics.density !== 19.1) {
            throw new Error('article 17 metrics mismatch');
          }
          if (article.metrics.words < 240 || article.metrics.words > 270) {
            throw new Error('article 17 word count outside preferred 240-270 range');
          }
          if (article.paras.length !== 5 || article.glossary.length !== 50) {
            throw new Error('article 17 structure mismatch');
          }
          console.log('article 17 exact metrics, preferred range and structure verified');
          NODE
