name: Release article 20

on:
  push:
    branches: [article-20-development]
    paths: [.github/workflows/release-article20.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: article-20-development
          fetch-depth: 0
      - name: Apply final article and synchronized release surfaces
        shell: bash
        run: |
          set -euo pipefail
          node tmp/finalize_article20.js
          python3 tmp/apply-site20.py
          python3 tmp/apply-docs20.py
          python3 tmp/apply-guard20.py
          python3 scripts/build_markdown.py | tee /tmp/report.txt
          grep -q "articles/20-the-market-came-after-the-limit.md  269 词 · 50 重点词 · 18.6%" /tmp/report.txt
          grep -q "20 篇已生成 · 1000 个重点词 · 全部通过" /tmp/report.txt
          node scripts/final-version-guard.js --write-manifest
          node scripts/final-version-guard.js
          node --check data/article-20.js
          node --check scripts/final-version-guard.js
          for page in index.html article.html words.html; do grep -q 'data/article-20.js' "$page"; done
          grep -q 'the-market-came-after-the-limit' sitemap.xml
          grep -q '下一篇编号为 \*\*21\*\*' notes/对话交接文档.md
          git diff --check
      - name: Remove one-time machinery and commit release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/consolidate-article20.yml
          rm -f .github/workflows/fix-article20-glossary.yml
          rm -f .github/workflows/release-article20.yml
          rm -rf tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: lock article 20 and synchronize 1000-word site"
          git push origin HEAD:article-20-development

# Word-count alignment: binding + itself restore the final 269-word cadence.
