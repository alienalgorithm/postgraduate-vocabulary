name: Integrate article 18 across the site

on:
  push:
    branches:
      - article-18-development
    paths:
      - .github/workflows/integrate-article-18.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out article 18 branch
        uses: actions/checkout@v6
        with:
          ref: article-18-development
          fetch-depth: 0

      - name: Prepare and run the one-time integration script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tmp/integrate-article-18.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('本次复核保持不变.\',', '本次复核保持不变。\',')
          text = text.replace("readme = readme.replace('850词索引', '900词索引')", "readme = replace_once(readme, '打印和850词索引。', '打印和900词索引。', 'README intro index')")
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile tmp/integrate-article-18.py
          python3 tmp/integrate-article-18.py

      - name: Regenerate the archive and lock final-version fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_markdown.py | tee /tmp/full-build.txt
          grep -q "articles/18-the-sky-would-not-go-quiet.md  269 词 · 50 重点词 · 18.6%" /tmp/full-build.txt
          grep -q "18 篇已生成 · 900 个重点词 · 全部通过" /tmp/full-build.txt
          node scripts/final-version-guard.js --write-manifest
          node scripts/final-version-guard.js | tee /tmp/final-guard.txt
          grep -q "18篇最终版本 · 900个重点词" /tmp/final-guard.txt
          node --check data/article-18.js
          node --check scripts/final-version-guard.js
          git diff --check

      - name: Verify synchronized website and documentation
        shell: bash
        run: |
          set -euo pipefail
          for page in index.html article.html words.html; do
            grep -q 'data/article-18.js' "$page"
          done
          grep -q 'the-sky-would-not-go-quiet' index.html
          grep -q 'the-sky-would-not-go-quiet' sitemap.xml
          grep -q '18篇文章、900个重点词' README.md
          grep -q '十八篇最终定稿，900个重点词' notes/对话交接文档.md
          grep -q '下一篇编号为 \*\*19\*\*' notes/对话交接文档.md
          grep -q '"article_count": 18' data/final-version-manifest.json
          grep -q '"keyword_count": 900' data/final-version-manifest.json

      - name: Commit the complete article 18 integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            404.html \
            README.md \
            article.html \
            index.html \
            manifest.webmanifest \
            sitemap.xml \
            words.html \
            assets/share-card.svg \
            data/final-version-manifest.json \
            notes/全库最终版本审计_2026-08-12.md \
            notes/对话交接文档.md \
            notes/第十八篇入库记录_2026-08-12.md \
            scripts/final-version-guard.js \
            .github/workflows/validate-content.yml
          git commit -m "integrate: publish article 18 across the 900-word site"
          git push origin HEAD:article-18-development
