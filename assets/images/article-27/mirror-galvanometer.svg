<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Thomson mirror galvanometer principle</title>
  <desc id="desc">A conceptual schematic showing a weak cable current producing a tiny mirror deflection, which turns a reflected light spot into a large displacement on a distant scale.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3ead9"/>
      <stop offset="1" stop-color="#d9c9ae"/>
    </linearGradient>
    <radialGradient id="light">
      <stop offset="0" stop-color="#fffbd8"/>
      <stop offset=".45" stop-color="#ffe58d" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffe58d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#101722"/>
  <rect x="85" y="80" width="1430" height="740" rx="26" fill="url(#paper)"/>
  <g stroke="#51483d" fill="none" stroke-width="8">
    <ellipse cx="575" cy="455" rx="255" ry="200"/>
    <ellipse cx="575" cy="455" rx="190" ry="145"/>
    <ellipse cx="575" cy="455" rx="125" ry="92"/>
  </g>
  <g stroke="#8a6c46" stroke-width="9">
    <line x1="575" y1="180" x2="575" y2="345"/>
    <line x1="545" y1="180" x2="545" y2="345"/>
  </g>
  <rect x="525" y="345" width="100" height="55" rx="6" fill="#24282f" stroke="#756c60" stroke-width="5" transform="rotate(-7 575 372)"/>
  <circle cx="574" cy="372" r="11" fill="#e7eef7"/>
  <g stroke="#4f6070" stroke-width="8" fill="none">
    <path d="M180 455 C235 455 270 455 320 455"/>
    <path d="M830 455 C900 455 950 455 1015 455"/>
  </g>
  <g fill="#24323d" font-family="Arial, sans-serif">
    <text x="145" y="420" font-size="28">weak cable current</text>
    <text x="445" y="700" font-size="28">coil</text>
    <text x="500" y="150" font-size="28">silk suspension</text>
    <text x="515" y="330" font-size="28">tiny mirror</text>
  </g>
  <g stroke="#d69c2f" stroke-width="7" fill="none">
    <line x1="990" y1="280" x2="595" y2="370"/>
    <line x1="595" y1="370" x2="1320" y2="590"/>
  </g>
  <circle cx="990" cy="280" r="76" fill="url(#light)"/>
  <circle cx="990" cy="280" r="20" fill="#fff9cf"/>
  <g transform="translate(1280 240)">
    <rect x="0" y="0" width="95" height="430" rx="8" fill="#f8f5ed" stroke="#554c41" stroke-width="6"/>
    <g stroke="#554c41" stroke-width="3">
      <line x1="0" y1="35" x2="32" y2="35"/><line x1="0" y1="70" x2="22" y2="70"/><line x1="0" y1="105" x2="32" y2="105"/><line x1="0" y1="140" x2="22" y2="140"/><line x1="0" y1="175" x2="32" y2="175"/><line x1="0" y1="210" x2="22" y2="210"/><line x1="0" y1="245" x2="32" y2="245"/><line x1="0" y1="280" x2="22" y2="280"/><line x1="0" y1="315" x2="32" y2="315"/><line x1="0" y1="350" x2="22" y2="350"/><line x1="0" y1="385" x2="32" y2="385"/>
    </g>
    <circle cx="48" cy="350" r="18" fill="#d99a2b"/>
  </g>
  <g fill="#24323d" font-family="Georgia, 'Times New Roman', serif">
    <text x="900" y="180" font-size="38">light source</text>
    <text x="1180" y="725" font-size="38">distant scale</text>
  </g>
  <g fill="#6a5b49" font-family="Arial, sans-serif" font-size="25">
    <text x="830" y="510">tiny angular deflection</text>
    <text x="980" y="555">becomes a large light-spot movement</text>
    <text x="520" y="785">Conceptual mechanism diagram · not a reconstruction of the museum object</text>
  </g>
</svg>
